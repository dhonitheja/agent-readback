name: tests

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} / py${{ matrix.python }} / ${{ matrix.deps }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.13"]
        deps: [minimal, mcp1, mcp2]
        include:
          # oldest supported Python, full extras
          - os: ubuntu-latest
            python: "3.10"
            deps: mcp2
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Install
        shell: bash
        run: |
          python -m pip install --upgrade pip
          case "${{ matrix.deps }}" in
            minimal) python -m pip install -e ".[dev]" ;;                     # MCP and LangGraph tests skip
            mcp1)    python -m pip install -e ".[dev,langgraph]" "mcp<2" ;;
            mcp2)    python -m pip install -e ".[dev,langgraph]" "mcp>=2" ;;
          esac
          python -m pip list | grep -iE '^(mcp|langgraph|langchain-core|httpx) ' || true

      - name: Test
        run: python -m pytest -q -rs

  security:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install with every optional dependency
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[langgraph,security]" mcp
      - name: Bandit (source code; fails on any unmarked finding)
        run: python -m bandit -r agent_readback examples -q
      - name: pip-audit (known vulnerabilities in installed dependencies)
        run: python -m pip_audit --skip-editable --progress-spinner off

  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Build wheel and sdist
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the wheel and run the CLI
        run: |
          python -m venv /tmp/wheel-env
          /tmp/wheel-env/bin/pip install dist/*.whl
          /tmp/wheel-env/bin/python -c "import agent_readback; print(agent_readback.__version__)"
          set +e; /tmp/wheel-env/bin/readback verify-log missing.jsonl; code=$?; set -e
          test "$code" -eq 3

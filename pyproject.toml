[project]
name = "agent-readback"
version = "0.3.1"
description = "Readback: check what an AI agent says it did against the system of record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Teja Ragula" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8", "tzdata; sys_platform == 'win32'"]  # zoneinfo has no system tz database on Windows
security = ["bandit==1.9.4", "pip-audit==2.10.1", "detect-secrets==1.5.0"]  # pinned so a scanner update cannot silently change the gate
langgraph = ["langgraph>=1.0", "langchain-core>=1.0", "langchain-anthropic>=1.0", "langchain-openai>=1.0", "tzdata; sys_platform == 'win32'"]

[project.scripts]
readback = "agent_readback.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_readback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

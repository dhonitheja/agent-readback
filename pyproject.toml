[project]
name = "agent-readback"
version = "0.2.1"
description = "Readback: check what an AI agent says it did against the system of record."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sai Teja Ragula" }]
dependencies = ["httpx>=0.27"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
readback = "agent_readback.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["agent_readback*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
